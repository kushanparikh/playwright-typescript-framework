name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # Continue even if tests fail (known failures expected)
      continue-on-error: true
      run: npx playwright test
    - name: Upload test results (including diffs)
      # Changed from 'failure()' to 'always()' to upload even on soft failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-diffs
        path: test-results/
        retention-days: 7
    - name: Upload Playwright report
      # Changed from '!cancelled()' to 'always()' for consistency
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
